{% macro rows(items) -%}
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;margin:12px 0;border-collapse:collapse">
{% for label, value in items if value %}<tr><td style="padding:6px 0;color:#6a6784;width:170px;vertical-align:top">{{ label }}</td><td style="padding:6px 0;font-weight:bold">{{ value }}</td></tr>{% endfor %}
</table>
{%- endmacro %}
{% macro button(url, label) -%}
<p style="margin:20px 0"><a href="{{ url }}" style="background:#4c3fd6;color:#ffffff;text-decoration:none;padding:11px 18px;border-radius:8px;display:inline-block;font-weight:bold">{{ label }}</a></p>
{%- endmacro %}
